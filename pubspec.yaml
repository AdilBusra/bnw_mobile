name: bnw_mobile
description: Beyond & Wanders mobile with a persistent local admin panel.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: 8.2.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Konfigurasi Ikon Aplikasi (Android, iOS, Web)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FEFBEA"
  image_path: "assets/images/logo_padded.png"
  adaptive_icon_background: "#FEFBEA"
  adaptive_icon_foreground: "assets/images/logo_padded.png"
  web:
    generate: true
    image_path: "assets/images/logo_padded.png"
    background_color: "#FEFBEA"
    theme_color: "#FEFBEA"

# Konfigurasi Native Splash Screen (tanpa logo Flutter & warna ikut splash_screen.dart)
flutter_native_splash:
  color: "#FEFBEA"
  image: "assets/images/logo_padded.png"
  android_12:
    color: "#FEFBEA"
    image: "assets/images/logo_padded.png"
  ios: true
  web: true