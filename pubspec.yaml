name: bnw_mobile
description: Beyond & Wanders mobile with a persistent local admin panel.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: 8.2.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
